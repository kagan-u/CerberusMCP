[package]
name = "cerberus-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Universal MCP management and gateway platform for AI-powered command-line tools"
repository = "https://github.com/cerberus-mcp/cerberus-mcp"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "ai", "gateway", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cerberus"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.7.0", features = [
    "server",
    "client",
    "macros",
    "schemars",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-std",
    "io-util",
    "time",
    "signal",
    "sync",
    "fs",
    "net",
] }
clap = { version = "4", features = ["derive", "env", "string", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
directories = "6"
uuid = { version = "1", features = ["v4", "serde"] }
secrecy = "0.10"
zeroize = "1"
url = { version = "2", features = ["serde"] }
time = { version = "0.3", features = ["formatting", "local-offset", "serde"] }
axum = "0.8"
tokio-util = { version = "0.7", features = ["rt"] }
clap_complete = "4"
http = "1"
# Used for the official MCP Registry client (`search`/`install`). Already in
# the tree via rmcp's streamable-http transport, so this adds no new build.
# Default features use rustls, not OpenSSL.
reqwest = { version = "0.13", features = ["json"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
