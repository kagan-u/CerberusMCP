name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: cerberus
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: cerberus.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (linux)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          stage="cerberus-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/cerberus" "$stage/"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          stage="cerberus-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/cerberus.exe" "$stage/"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          7z a "$stage.zip" "$stage"
      - uses: actions/upload-artifact@v4
        with:
          name: cerberus-${{ matrix.name }}
          path: cerberus-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  gui-macos:
    name: gui (macOS .app + .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            gui/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Sync GUI version with release tag
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            v*) v="${GITHUB_REF_NAME#v}" ;;
            *) v="$(jq -r .version gui/src-tauri/tauri.conf.json)" ;;
          esac
          echo "GUI version: $v"
          jq --arg v "$v" '.version = $v' gui/src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json gui/src-tauri/tauri.conf.json
          python3 - "$v" <<'PY' > /dev/null
          import re, sys
          p = "gui/src-tauri/Cargo.toml"
          s = open(p).read()
          s = re.sub(r'(?m)^version = ".*"$', f'version = "{sys.argv[1]}"', s, count=1)
          open(p, "w").write(s)
          PY
      - name: Build bundles (universal)
        working-directory: gui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin
      - name: Collect artifacts
        shell: bash
        run: |
          v="$(jq -r .version gui/src-tauri/tauri.conf.json)"
          base="gui/src-tauri/target/universal-apple-darwin/release/bundle"
          tar -C "$base/macos" -czf "CerberusMCP_${v}_universal.app.tar.gz" CerberusMCP.app
          mv "$base/dmg/CerberusMCP_${v}_universal.dmg" .
          ls -la CerberusMCP_*
      - uses: actions/upload-artifact@v4
        with:
          name: cerberus-gui-macos
          path: |
            CerberusMCP_*_universal.app.tar.gz
            CerberusMCP_*_universal.dmg
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, gui-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cerberus-linux-x86_64.tar.gz
            cerberus-windows-x86_64.zip
            CerberusMCP_*_universal.app.tar.gz
            CerberusMCP_*_universal.dmg
