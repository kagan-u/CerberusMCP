name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: cerberus
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: cerberus.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (linux)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          stage="cerberus-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/cerberus" "$stage/"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          stage="cerberus-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/cerberus.exe" "$stage/"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          7z a "$stage.zip" "$stage"
      - uses: actions/upload-artifact@v4
        with:
          name: cerberus-${{ matrix.name }}
          path: cerberus-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  gui-macos:
    name: gui (macOS .app + .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: brew install ninja glfw
      - name: Configure + build
        working-directory: gui
        run: |
          cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rel --target CerberusMCP
      - name: Package .app + .dmg
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$GITHUB_REF" ] && v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          bash gui/scripts/package-macos.sh gui/build-rel "$v"
      - uses: actions/upload-artifact@v4
        with:
          name: cerberus-gui-macos
          path: |
            CerberusMCP_*_macos.app.tar.gz
            CerberusMCP_*_macos.dmg
          if-no-files-found: error

  gui-windows:
    name: gui (Windows portable zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Ninja
        run: choco install ninja -y
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure + build
        working-directory: gui
        shell: bash
        run: |
          cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rel --target CerberusMCP
      - name: Package
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$GITHUB_REF" ] && v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          stage="CerberusMCP_${v}_windows-x86_64"
          mkdir -p "$stage"
          cp gui/build-rel/CerberusMCP.exe "$stage/"
          cp -R gui/assets "$stage/assets"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          7z a "$stage.zip" "$stage"
          ls -la "$stage.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cerberus-gui-windows
          path: CerberusMCP_*_windows-x86_64.zip
          if-no-files-found: error

  gui-linux:
    name: gui (Linux portable tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3-dev libgl1-mesa-dev ninja-build
      - name: Configure + build
        working-directory: gui
        run: |
          cmake -S . -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rel --target CerberusMCP
      - name: Package
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_NAME" = "$GITHUB_REF" ] && v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          stage="CerberusMCP_${v}_linux-x86_64"
          mkdir -p "$stage"
          cp gui/build-rel/CerberusMCP "$stage/"
          cp -R gui/assets "$stage/assets"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          ls -la "$stage.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: cerberus-gui-linux
          path: CerberusMCP_*_linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, gui-macos, gui-windows, gui-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cerberus-linux-x86_64.tar.gz
            cerberus-windows-x86_64.zip
            CerberusMCP_*_macos.app.tar.gz
            CerberusMCP_*_macos.dmg
            CerberusMCP_*_windows-x86_64.zip
            CerberusMCP_*_linux-x86_64.tar.gz
